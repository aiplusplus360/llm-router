[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-router"
version = "0.1.0"
description = "Route each prompt to the cheapest model that can do the job. Budget caps, fallbacks, and an explainable decision."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "khawajasafiullah18" }]
dependencies = []

[project.scripts]
llm-router = "llmrouter.cli:main"

[tool.setuptools.packages.find]
include = ["llmrouter*"]
